<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scuderia Login</title>
    <!-- Hubungkan ke file style.css yang sama agar warnanya serasi -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="login-wrapper">
        <div class="login-container">
            <h2>SCUDERIA LOGIN</h2>
            <p class="login-subtitle">Access X TKJ 1 Main Dashboard</p>
            
            <form action="dashboard.html" method="GET">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter siber ID..." required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter passkey..." required>
                </div>
                
                <button type="submit" class="login-btn">INITIALIZE LOGIN</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <p class="copyright">&copy; 2023 Scuderia X TKJ 1. All rights reserved.</p>
    </div>

</body>
</html>
